org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
# 关闭 per-class dexing，强制所有类合并进单个 classes.dex。
# 原因：AGP 在 minSdk>=21 的 debug 构建下会把类拆到 classes2.dex，
# 部分 LSPosed/Xposed 实现加载模块时只扫主 dex，导致入口类 ClassNotFound、
# 模块静默加载失败（表现为"已启用但毫无反应、也没有任何日志"）。
android.enableDexingArtifactTransform=false

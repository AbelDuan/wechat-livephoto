apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.abel.wechatlive"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    namespace 'com.abel.wechatlive'
}

dependencies {
    // LSPosed / Xposed 标准 API（compileOnly，不打包进 apk）
    compileOnly 'de.robv.android.xposed:api:82'
}

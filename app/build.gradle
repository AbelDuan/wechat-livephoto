apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.abel.wechatlive"
        minSdkVersion 24
        targetSdkVersion 28
        versionCode 21
        versionName "8.3"
        // 必须单 dex：见 gradle.properties 说明
        multiDexEnabled false
    }

    // 固定签名。CI 每次生成随机 debug key 会导致「覆盖安装签名不一致」，
    // 用仓库内固定 keystore 后，以后所有版本都能直接覆盖安装。
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    namespace 'com.abel.wechatlive'
}

dependencies {
    // LSPosed / Xposed 标准 API（compileOnly，不打包进 apk）
    compileOnly 'de.robv.android.xposed:api:82'
}

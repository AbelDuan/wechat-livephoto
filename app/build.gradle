apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.abel.wechatlive"
        minSdkVersion 24
        // 模块自身页面需要直读 /sdcard 上的日志文件，targetSdk 28 保留旧版存储语义
        targetSdkVersion 28
        versionCode 3
        versionName "3.0"
        // 必须单 dex：见 gradle.properties 说明
        multiDexEnabled false
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    namespace 'com.abel.wechatlive'
}

dependencies {
    // LSPosed / Xposed 标准 API（compileOnly，不打包进 apk）
    compileOnly 'de.robv.android.xposed:api:82'
}

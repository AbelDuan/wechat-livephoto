name: Build WechatLive LSPosed Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 模块 App 自己的进程里没有 XposedBridge。UI 侧任何一个类只要
      # 直接/间接引用到 de.robv.android.xposed.* 或 MainHook，
      # 类校验就会 NoClassDefFoundError → 「打开模块就闪退」（v3 的原因）。
      - name: Guard - UI classes must not touch Xposed
        run: |
          BAD=0
          for f in MainActivity StatusProvider LogStore Const; do
            P="app/src/main/java/com/abel/wechatlive/$f.java"
            if grep -nE 'de\.robv\.android\.xposed|XposedBridge|XposedHelpers|MainHook' "$P"; then
              echo "::error::$f.java 引用了 Xposed/MainHook，会导致模块 App 闪退"
              BAD=1
            fi
          done
          [ "$BAD" = "0" ] && echo "OK: UI 层与 Xposed 完全隔离"
          exit $BAD

      - name: Build debug APK (auto-signed with debug key)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.5
          build-root-directory: .
          arguments: :app:assembleDebug

      # LSPosed 部分实现加载模块只扫主 dex，入口类必须在 classes.dex 里。
      # 出现 classes2.dex 就直接让构建失败，避免又产出一个"装了没反应"的包。
      - name: Verify single-dex & entry class
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK = $APK"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex|assets/xposed'
          if unzip -l "$APK" | grep -q 'classes2.dex'; then
            echo "::error::APK 被拆成多个 dex，入口类可能不在主 dex，LSPosed 会加载失败"
            exit 1
          fi
          unzip -p "$APK" classes.dex > /tmp/c.dex
          if ! grep -q 'com/abel/wechatlive/MainHook' /tmp/c.dex; then
            echo "::error::主 dex 中找不到 MainHook 入口类"
            exit 1
          fi
          echo "OK: 单 dex，且 MainHook 在主 dex 中"
          echo "--- 签名指纹（应每次构建都一致，保证可覆盖安装）---"
          unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -E 'SHA1|SHA256' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WechatLive-apk
          path: app/build/outputs/apk/debug/*.apk
